services:
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: skillbridge-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SkillBridge2026!"
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  sql-data:
